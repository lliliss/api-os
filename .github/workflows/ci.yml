name: CI - API OS

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    # banco temporário só pra rodar os testes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: os_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # variáveis que substituem o .env no github
    env:
      SPRING_PROFILE: dev
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: os_db_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
      JWT_EXPIRATION: 28800000

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Dar permissão ao mvnw
        run: chmod +x mvnw

      - name: Compilar, testar e analisar
        run: ./mvnw verify

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/site/jacoco/
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml